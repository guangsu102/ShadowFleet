# ShadowFleet Nginx Reverse Proxy Configuration
# Place in /etc/nginx/conf.d/shadowfleet.conf
#
# Prerequisites:
#   1. SSL certificate (Let's Encrypt recommended):
#      certbot --nginx -d sf.rensw.xyz
#
#   2. Reload nginx after deployment:
#      sudo nginx -t && sudo systemctl reload nginx
#
# DNS: Point sf.rensw.xyz A/AAAA records to your ShadowFleet server IP.

upstream shadowfleet_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

upstream shadowfleet_streamlit {
    server 127.0.0.1:8501;
    keepalive 32;
}

server {
    listen 80;
    server_name sf.rensw.xyz;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sf.rensw.xyz;

    # ---- SSL Configuration (update cert paths after certbot) ----
    ssl_certificate /etc/letsencrypt/live/sf.rensw.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sf.rensw.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security Headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- API (FastAPI on port 8000) ----
    location /api/ {
        proxy_pass http://shadowfleet_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;  # Forward client correlation ID
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }

    # ---- Vue 3 Frontend Dev Proxy (development only — for production, build dist/ first) ----
    # In development: Vite dev server on :5173 proxies /api to :8000
    # In production: serve built static files
    location / {
        # Point to Streamlit for the legacy UI, or comment out to serve Vue build:
        proxy_pass http://shadowfleet_streamlit;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For Vue production build, uncomment below instead:
        # alias /opt/shadowfleet/frontend/dist;
        # try_files $uri $uri/ /index.html;
    }

    # ---- Probe Server (Phone-Home on port 8787) ----
    # Only expose in DMZ or internal network — not public
    location /probe/ {
        # restrict by IP or VPN — example:
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ---- Artifact Cache (optional, port 8080) ----
    location /artifacts/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;

        # Cache static artifacts for 24h
        expires 24h;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/shadowfleet_access.log;
    error_log  /var/log/nginx/shadowfleet_error.log;
}
