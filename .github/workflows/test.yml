name: ShadowFleet Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short -m integration

  service-tests:
    name: Service Layer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run service layer tests
        run: |
          pytest tests/service/ -v --tb=short -m service

  infrastructure-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run infrastructure tests
        run: |
          pytest tests/infrastructure/ -v --tb=short

  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . --output-format=github

  type-sync:
    name: Type Sync Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Start FastAPI server in background
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting for server startup..."
          sleep 5

      - name: Run type sync validator
        run: |
          python scripts/validate_type_sync.py
        env:
          OPENAPI_URL: http://127.0.0.1:8000/openapi.json

      - name: Frontend TypeScript check
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and type-check
        if: success() || failure()
        run: |
          cd frontend
          npm ci
          npm run type-check

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests, integration-tests, service-tests, infrastructure-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  all-tests-pass:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [lint, type-sync, unit-tests, integration-tests, service-tests, infrastructure-tests, coverage]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "All test jobs completed. Check the results above."
